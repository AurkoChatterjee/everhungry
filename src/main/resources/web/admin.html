<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin - EverHungry</title>
  <link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/css/app.css">
  <style>
    .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; margin-top: 20px; }
    .stat { padding: 18px; } .stat b { display: block; font: 600 1.9rem var(--serif); margin-top: 4px; }
    .charts { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; margin-top: 18px; }
    .bars { display: flex; align-items: flex-end; gap: 10px; height: 170px; margin-top: 14px; }
    .bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 6px; }
    .bar i { width: 100%; border-radius: 10px 10px 4px 4px; background: linear-gradient(180deg, var(--orchid), #5a35c9); min-height: 3px; }
    .bar span { font: 400 .72rem var(--mono); color: var(--muted); }
    .hbar { display: grid; grid-template-columns: 130px 1fr 36px; align-items: center; gap: 10px; padding: 4px 0; font-size: .88rem; }
    .hbar i { display: block; height: 10px; border-radius: 5px; background: var(--saffron); }
    @media (max-width: 920px) { .charts { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="orbs"></div>
<header id="nav"></header>
<main class="wrap">
  <h1 style="font-size:2.4rem;margin-top:30px">Admin</h1>
  <div class="seg tabs" id="tabs">
    <button data-t="overview" class="on">Overview</button><button data-t="orders">Orders</button>
    <button data-t="restaurants">Restaurants</button><button data-t="users">Users</button>
  </div>

  <section id="overview">
    <div class="stats" id="stats"></div>
    <div class="charts">
      <div class="glass pad"><h3>Orders in the last 7 days</h3><div class="bars" id="daily"></div></div>
      <div class="glass pad"><h3>Orders by status</h3><div id="statuses" style="margin-top:10px"></div></div>
    </div>
  </section>

  <section id="orders" class="hidden glass pad" style="margin-top:20px"><div style="overflow-x:auto"><table>
    <thead><tr><th>Order</th><th>Restaurant</th><th>Customer</th><th>Driver</th><th>Status</th><th>Total</th><th>Placed</th></tr></thead><tbody id="orderRows"></tbody></table></div></section>

  <section id="restaurants" class="hidden glass pad" style="margin-top:20px"><div style="overflow-x:auto"><table>
    <thead><tr><th>Restaurant</th><th>Owner</th><th>Orders</th><th>Status</th><th></th></tr></thead><tbody id="restRows"></tbody></table></div></section>

  <section id="users" class="hidden glass pad" style="margin-top:20px"><div style="overflow-x:auto"><table>
    <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th>Account</th><th></th></tr></thead><tbody id="userRows"></tbody></table></div></section>
</main>
<script src="/js/app.js"></script>
<script>
const day = iso => new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });

async function loadStats() {
  const s = await api('/admin/stats'), t = s.totals;
  const card = (label, value) => `<div class="glass stat"><span class="muted">${label}</span><b>${value}</b></div>`;
  $('#stats').innerHTML = card('Total orders', t.orders) + card('Active now', t.active) + card('Delivered revenue', money(t.revenue)) +
    card('Restaurants', t.restaurants) + card('Customers', t.customers) + card('Drivers', t.drivers);

  const days = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d.toLocaleDateString('en-CA')); }
  const byDay = Object.fromEntries(s.daily.map(r => [r.day, r.orders]));
  const max = Math.max(1, ...days.map(d => byDay[d] || 0));
  $('#daily').innerHTML = days.map(d => `<div class="bar" title="${byDay[d] || 0} orders"><span>${byDay[d] || 0}</span><i style="height:${(byDay[d] || 0) / max * 100}%"></i><span>${d.slice(8)}/${d.slice(5, 7)}</span></div>`).join('');

  const top = Math.max(1, ...s.statuses.map(r => r.n));
  $('#statuses').innerHTML = s.statuses.length ? s.statuses.map(r =>
    `<div class="hbar"><span>${STATUS[r.status] || r.status}</span><i style="width:${r.n / top * 100}%"></i><span class="mono">${r.n}</span></div>`).join('')
    : '<div class="muted">No orders yet.</div>';
}
async function loadOrders() {
  const list = await api('/admin/orders');
  $('#orderRows').innerHTML = list.map(o => `<tr><td class="mono">#${o.id}</td><td>${esc(o.restaurant_name)}</td><td>${esc(o.customer_name)}</td>
    <td>${esc(o.driver_name || '-')}</td><td>${pill(o.status)}</td><td class="mono">${money(o.total)}</td><td class="mono">${day(o.created_at)} ${timeOf(o.created_at)}</td></tr>`).join('')
    || '<tr><td colspan="7" class="muted">No orders yet.</td></tr>';
}
async function loadRestaurants() {
  const list = await api('/admin/restaurants');
  $('#restRows').innerHTML = list.map(r => `<tr><td><strong>${esc(r.name)}</strong><div class="muted" style="font-size:.85rem">${esc(r.cuisine || '')}</div></td>
    <td>${esc(r.owner_name)}<div class="muted" style="font-size:.85rem">${esc(r.owner_email)}</div></td><td class="mono">${r.order_count}</td>
    <td><span class="pill ${r.is_open ? 'open' : 'closed'}">${r.is_open ? 'Open' : 'Closed'}</span></td>
    <td><button class="btn sm ${r.is_open ? 'danger' : 'good'}" data-rest="${r.id}" data-open="${!r.is_open}">${r.is_open ? 'Close' : 'Reopen'}</button></td></tr>`).join('');
  $$('[data-rest]').forEach(b => b.onclick = async () => {
    try { await api(`/admin/restaurants/${b.dataset.rest}/open`, 'POST', { open: b.dataset.open === 'true' }); await loadRestaurants(); } catch (e) { fail(e); }
  });
}
async function loadUsers() {
  const list = await api('/admin/users');
  $('#userRows').innerHTML = list.map(u => `<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td><span class="role-tag">${ROLE_LABEL[u.role] || u.role}</span></td>
    <td class="mono">${day(u.created_at)}</td><td><span class="pill ${u.suspended ? 'closed' : 'open'}">${u.suspended ? 'Suspended' : 'Active'}</span></td>
    <td>${u.role === 'admin' ? '' : `<button class="btn sm ${u.suspended ? 'good' : 'danger'}" data-user="${u.id}" data-sus="${!u.suspended}">${u.suspended ? 'Restore' : 'Suspend'}</button>`}</td></tr>`).join('');
  $$('[data-user]').forEach(b => b.onclick = async () => {
    try { await api(`/admin/users/${b.dataset.user}/suspend`, 'POST', { suspended: b.dataset.sus === 'true' }); await loadUsers(); } catch (e) { fail(e); }
  });
}
const loaders = { overview: loadStats, orders: loadOrders, restaurants: loadRestaurants, users: loadUsers };
let tab = 'overview';
const refresh = () => loaders[tab]().catch(fail);
$$('#tabs button').forEach(b => b.onclick = () => {
  tab = b.dataset.t;
  $$('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  Object.keys(loaders).forEach(t => $('#' + t).classList.toggle('hidden', t !== tab));
  refresh();
});
(async () => {
  if (!(await boot(['admin']))) return;
  refresh();
  live(ev => { if (ev.type === 'order' || ev.type === 'poll') refresh(); });
})();
</script>
</body>
</html>
